<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SR Atlas — Soul's Remnant Interactive Map</title>
    <meta
      name="description"
      content="An interactive map to find areas, monsters, resources, and warp points in Soul's Remnant."
    />
    <meta name="theme-color" content="#071a31" />
    <link rel="canonical" href="https://sratlas.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:title" content="SR Atlas — Soul's Remnant Interactive Map" />
    <meta
      property="og:description"
      content="An interactive map to find areas, monsters, resources, and warp points in Soul's Remnant."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sratlas.com/" />
    <meta property="og:image" content="https://sratlas.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SR Atlas — Soul's Remnant Interactive Map" />
    <meta
      name="twitter:description"
      content="An interactive map to find areas, monsters, resources, and warp points in Soul's Remnant."
    />
    <meta name="twitter:image" content="https://sratlas.com/og-image.png" />
  </head>
  <body>
    <script>
      (() => {
        const storageKey = "srw-theme";
        let storedTheme;

        try {
          storedTheme = localStorage.getItem(storageKey);
        } catch {
          storedTheme = null;
        }

        const theme =
          storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
            ? storedTheme
            : "system";
        const resolvedTheme =
          theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : theme === "dark"
              ? "dark"
              : "light";

        document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
        document.documentElement.style.colorScheme = resolvedTheme;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
